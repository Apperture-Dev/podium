services:
  frankenphp:
    build:
      context: .
      dockerfile: ./docker/franken-php/Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      FRANKENPHP_CONFIG: "worker ./public/index.php"
      MESSENGER_TRANSPORT_DSN: redis://redis:6379
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
    ports:
      - "${PODIUM_HTTP_PORT:-8090}:80"
      - "${PODIUM_METRICS_PORT:-9091}:9090"

  redis:
    image: redis:alpine
    restart: unless-stopped
    # Sin publicar puerto al host: solo se usa dentro de la red de compose (evita
    # chocar con otros Redis locales, p. ej. craft-market en 6379).
    volumes:
      - redis_data:/data

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
  redis_data:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
