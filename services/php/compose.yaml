services:
  # Stage "dev" (docker/franken-php/Dockerfile): bind mount de todo el
  # código, sin worker mode, corre como usuario no-root con el UID/GID del
  # host — mismo patrón que discovery-room. El stage "prod" (worker mode,
  # código copiado dentro de la imagen, sin bind mount) sigue existiendo
  # para cuando haga falta construir la imagen real de despliegue; aquí no
  # se usa por defecto.
  #
  # Primer arranque: `docker compose exec frankenphp composer install`
  # (vendor/ no viene en la imagen dev, se instala en caliente y queda en
  # el host gracias al bind mount).
  #
  # Sin MESSENGER_TRANSPORT_DSN/DATABASE_URL aquí: con el código montado,
  # el propio Dotenv de Symfony ya los lee de .env/.env.local — duplicarlos
  # en `environment:` es una segunda fuente de verdad que puede desincronizarse.
  frankenphp:
    build:
      context: .
      dockerfile: ./docker/franken-php/Dockerfile
      target: dev
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    restart: unless-stopped
    volumes:
      - ./:/app
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
    ports:
      - "${PODIUM_HTTP_PORT:-8090}:80"

  redis:
    image: redis:alpine
    restart: unless-stopped
    # Sin publicar puerto al host: solo se usa dentro de la red de compose (evita
    # chocar con otros Redis locales, p. ej. craft-market en 6379).
    volumes:
      - redis_data:/data

  # Identity provider — emite los JWT cuyo claim `sub` es el `userId` opaco
  # que ya usa el dominio (ver context-map.md: userId nunca se modela como
  # aggregate propio). Modo dev (start-dev), realm "podium" importado desde
  # docker/keycloak/podium-realm.json al arrancar.
  #
  # Admin console: http://localhost:${PODIUM_KEYCLOAK_PORT:-8091}/admin
  #   (usuario: ${KEYCLOAK_ADMIN:-admin} / clave: ${KEYCLOAK_ADMIN_PASSWORD:-admin})
  #
  # Token de prueba (client "podium-api", secret "podium-dev-secret",
  # usuario "testuser"/"testuser" ya cargado en el realm importado):
  #   curl -X POST \
  #     http://localhost:${PODIUM_KEYCLOAK_PORT:-8091}/realms/podium/protocol/openid-connect/token \
  #     -H "Content-Type: application/x-www-form-urlencoded" \
  #     -d "grant_type=password&client_id=podium-api&client_secret=podium-dev-secret&username=testuser&password=testuser"
  # El campo "sub" del JWT devuelto (decodificarlo en jwt.io o con `jq`) es el
  # userId opaco que espera el dominio (p. ej. App\Team\Domain\ValueObject\UserId).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/keycloak/podium-realm.json:/opt/keycloak/data/import/podium-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    ports:
      - "${PODIUM_KEYCLOAK_PORT:-8091}:8080"

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
  redis_data:
  keycloak_data:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
