;; 02-memory.ini - Gestión de memoria para pods pequeños
;; Optimizado para 256Mi-512Mi containers

[memory]
; Memory limit conservador para pods pequeños
memory_limit = 384M
; Si el pod tiene 512Mi, deja ~128Mi para FrankenPHP + sistema

; Límites de ejecución
max_execution_time = 30
max_input_time = 15
default_socket_timeout = 10

; Límites de input para seguridad y memory
max_input_vars = 5000
max_input_nesting_level = 128
post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20

; Memory debugging (solo para troubleshooting)
; report_memleaks=0
; memory_get_usage=0

; Realpath cache - crítico para performance en K8s
realpath_cache_size = 8M
realpath_cache_ttl = 14400

; User streams
allow_url_fopen = 0
allow_url_include = 0
