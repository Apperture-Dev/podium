;; 05-frankenphp.ini - Configuraciones específicas para FrankenPHP worker
;; Optimizado para worker mode con alta concurrencia

[frankenphp]
; FPM settings no aplican, pero configuramos equivalentes

; Timeouts específicos para worker mode
max_execution_time=15
max_input_time=5

; Exit on timeout para evitar workers colgados
exit_on_timeout=1

; Garbage collection optimizada para long-running workers
zend.enable_gc=1

; Configuración de GC para evitar memory leaks en workers
gc.threshold.trigger=10000
gc.threshold.buffer_size=8192

; File uploads optimización
file_uploads=1
upload_tmp_dir="/tmp"
max_file_uploads=20

; Auto-prepend/append files para workers
auto_prepend_file=""
auto_append_file=""

; User agent
user_agent="FrankenPHP/1.3"

; Default MIME type
default_mimetype="text/html"
default_charset="UTF-8"

; Precision para float operations
precision=14

; Ignore user abort para workers estables
ignore_user_abort=0

; Enable flush para streaming responses
implicit_flush=0

; Configuración de buffering para mejor throughput
output_buffering=4096
zlib.output_compression=0

; Magic quotes siempre OFF (PHP 8.3)
magic_quotes_gpc=0
magic_quotes_runtime=0
magic_quotes_sybase=0

; Register globals OFF
register_globals=0
register_argc_argv=0

; Variables order optimizada
variables_order="EGPCS"
request_order="GP"

; Output buffering - crítico para latencia
output_buffering=4096
implicit_flush=0
output_handler=""
