;; 01-opcache.ini - OPcache optimizado para pods pequeños
;; Configuración crítica para reducir tiempo de rendering

[opcache]
; Habilitar OPcache
opcache.enable = 1
opcache.enable_cli = 1

; Memoria optimizada para pods pequeños (256Mi-512Mi)
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32

; Archivos - ajustado para Symfony typical
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 10

; Performance crítico para worker mode
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 0
opcache.load_comments = 0
opcache.fast_shutdown = 1
opcache.enable_file_override = 1

; Optimizaciones específicas para FrankenPHP worker
opcache.optimization_level = 0x7FFEBFFF
opcache.dups_fix = 1
opcache.blacklist_filename = ""

; File cache para persistencia entre pods
opcache.file_cache = ""
opcache.file_cache_only = 0
opcache.file_cache_consistency_checks = 0

; JIT para PHP 8.3 (cuidado con memory footprint)
opcache.jit_buffer_size = 0
opcache.jit = disable

; Preloading — el Dockerfile la agrega condicionalmente si config/preload.php existe
; opcache.preload = /app/config/preload.php
; opcache.preload_user = www-data
