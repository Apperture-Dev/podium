security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Sin proveedor real — el Bearer token ya trae la identidad (claim
    # `sub`), no hay un aggregate User propio que cargar (ver context-map.md).
    providers:
        users_in_memory: { memory: null }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            lazy: true
            access_token:
                token_handler: App\Shared\Infrastructure\Security\KeycloakAccessTokenHandler

    # Solo la primera regla que matchea se aplica — /api/doc* y los
    # endpoints de escritura ya existentes quedan públicos por ahora;
    # el resto de /api exige un Bearer JWT válido.
    access_control:
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/teams$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/projects$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
        firewalls:
            dev:
                pattern: ^/(_profiler|_wdt|assets|build)/
                security: false
            api:
                pattern: ^/api
                stateless: true
                lazy: true
                access_token:
                    token_handler: App\Shared\Infrastructure\Security\InMemoryAccessTokenHandler
