when@test:
    framework:
        messenger:
            transports:
                source_changed: 'in-memory://'
                application_source_changed: 'in-memory://'
                service_discovered: 'in-memory://'
                project_registered: 'in-memory://'
                application_registered: 'in-memory://'
                application_build_requested: 'in-memory://'
                application_deploy_requested: 'in-memory://'
                build_job_requested: 'in-memory://'
                job_succeeded: 'in-memory://'
                job_failed: 'in-memory://'
                build_succeeded: 'in-memory://'
                build_failed_app_manager: 'in-memory://'
                deploy_attempt_requested: 'in-memory://'
                health_check_succeeded: 'in-memory://'
                health_check_exhausted: 'in-memory://'
                deploy_succeeded: 'in-memory://'
                deploy_failed_app_manager: 'in-memory://'

framework:
    messenger:
        failure_transport: failed_events

        transports:
            # --- Producer-side / consumidos por Project ---
            source_changed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.source-changed', group: 'project', consumer: 'project-1' }

            # --- Publicados por Project, consumidos por App Manager ---
            application_source_changed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.application-source-changed', group: 'app-manager', consumer: 'app-manager-1' }
            service_discovered:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.service-discovered', group: 'app-manager', consumer: 'app-manager-1' }
            project_registered:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.project-registered', group: 'appsource', consumer: 'appsource-1' }

            # --- Publicado por App Manager, sin consumidor identificado todavía ---
            application_registered:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.application-registered', group: 'unassigned', consumer: 'unassigned-1' }

            # --- Build -> App Manager ---
            build_succeeded:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.build-succeeded', group: 'app-manager', consumer: 'app-manager-1' }

            # --- BuildFailed: único fanout real (App Manager + Notification + Remediation), un transporte
            #     por consumidor porque cada uno necesita su propio consumer group sobre el mismo stream ---
            build_failed_app_manager:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.build-failed', group: 'app-manager', consumer: 'app-manager-1' }
            build_failed_notification:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.build-failed', group: 'notification', consumer: 'notification-1' }
            build_failed_remediation:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.build-failed', group: 'remediation', consumer: 'remediation-1' }

            # --- App Manager -> Deploy ---
            application_deploy_requested:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.application-deploy-requested', group: 'deploy', consumer: 'deploy-1' }

            # --- Deploy -> App Manager ---
            deploy_succeeded:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.deploy-succeeded', group: 'app-manager', consumer: 'app-manager-1' }

            # --- DeployFailed: fanout a App Manager + Remediation ---
            deploy_failed_app_manager:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.deploy-failed', group: 'app-manager', consumer: 'app-manager-1' }
            deploy_failed_remediation:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.deploy-failed', group: 'remediation', consumer: 'remediation-1' }

            # --- App Manager -> Build ---
            application_build_requested:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.application-build-requested', group: 'build', consumer: 'build-1' }

            # --- Build -> lanzador de Kubernetes (Go, services/build-launcher) ---
            # serializer explícito: estos tres transports cruzan a un consumidor/productor
            # en Go, así que necesitan JSON real (body + headers.type) en vez del
            # serializador nativo de PHP (el default de este proyecto, ver los demás
            # transports de este fichero) — ver docs/ del plan del build-launcher.
            # delete_after_ack/reject en false: PHP nunca consume este stream (solo
            # publica) — su propio grupo "unassigned" jamás hace ack, así que no hay
            # nada que borrar desde este lado. build-launcher (Go) ya crea su propio
            # grupo y hace XACK+XDEL tras procesar cada mensaje (XDEL borra la
            # entrada del stream entero, no por grupo — limpia igual). Con el default
            # (true) el propio Connection::setup() de symfony/redis-messenger revienta
            # en cuanto detecta más de un grupo en el stream — justo lo que pasa aquí,
            # porque build-launcher ya creó el suyo antes de que PHP publique nada.
            build_job_requested:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options: { stream: 'podium.build-job-requested', group: 'unassigned', consumer: 'unassigned-1', delete_after_ack: false, delete_after_reject: false }

            # --- Lanzador de Kubernetes -> Build (Go, services/build-launcher) ---
            job_succeeded:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options: { stream: 'podium.job-succeeded', group: 'build', consumer: 'build-1' }
            job_failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options: { stream: 'podium.job-failed', group: 'build', consumer: 'build-1' }

            # --- Deploy -> lanzador de ArgoCD (Go, services/deploy-launcher) ---
            # serializer explícito: mismo motivo que build_job_requested/job_succeeded/job_failed
            # más arriba — estos tres cruzan a un consumidor/productor en Go, necesitan JSON real.
            # delete_after_ack/reject en false: mismo motivo que build_job_requested
            # más arriba — PHP solo publica aquí, deploy-launcher (Go) es quien de
            # verdad consume y limpia con su propio grupo.
            deploy_attempt_requested:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options: { stream: 'podium.deploy-attempt-requested', group: 'unassigned', consumer: 'unassigned-1', delete_after_ack: false, delete_after_reject: false }

            # --- Lanzador de ArgoCD -> Deploy (Go, services/deploy-launcher) ---
            health_check_succeeded:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options: { stream: 'podium.health-check-succeeded', group: 'deploy', consumer: 'deploy-1' }
            health_check_exhausted:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options: { stream: 'podium.health-check-exhausted', group: 'deploy', consumer: 'deploy-1' }

            failed_events:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { stream: 'podium.failed-events', group: 'failed', consumer: 'failed-1' }

        # Un único bus — solo para eventos de dominio que cruzan BCs por Redis.
        # No hay command bus ni query bus: las operaciones dentro de un BC se
        # llaman directo al ApplicationService, sin esa capa de indirección.
        routing:
            'App\AppSource\Domain\Event\SourceChanged': source_changed
            'App\Project\Domain\Event\ApplicationSourceChanged': application_source_changed
            'App\Project\Domain\Event\ServiceDiscovered': service_discovered
            'App\Project\Domain\Event\ProjectRegistered': project_registered
            'App\AppManager\Domain\Event\ApplicationRegistered': application_registered
            'App\AppManager\Domain\Event\ApplicationBuildRequested': application_build_requested
            'App\AppManager\Domain\Event\ApplicationDeployRequested': application_deploy_requested
            'App\Build\Domain\Event\BuildJobRequested': build_job_requested
            'App\Build\Domain\Event\BuildSucceeded': build_succeeded
            'App\Build\Domain\Event\BuildFailed': build_failed_app_manager
            # Entrantes del lanzador de Kubernetes (Go, diferido) — sin clase compartible, DTO local (ver Build/Application/Message/)
            'App\Build\Application\Message\JobSucceeded': job_succeeded
            'App\Build\Application\Message\JobFailed': job_failed
            'App\Deploy\Domain\Event\DeployAttemptRequested': deploy_attempt_requested
            'App\Deploy\Domain\Event\DeploySucceeded': deploy_succeeded
            'App\Deploy\Domain\Event\DeployFailed': deploy_failed_app_manager
            # Entrantes del lanzador de ArgoCD (Go, diferido) — sin clase compartible, DTO local (ver Deploy/Application/Message/)
            'App\Deploy\Application\Message\HealthCheckSucceeded': health_check_succeeded
            'App\Deploy\Application\Message\HealthCheckExhausted': health_check_exhausted
