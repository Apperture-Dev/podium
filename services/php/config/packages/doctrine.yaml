doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        types:
            project_id: App\Project\Infrastructure\Persistence\Doctrine\Type\ProjectIdType
            hash: App\Project\Infrastructure\Persistence\Doctrine\Type\HashType
            project_name: App\Project\Infrastructure\Persistence\Doctrine\Type\ProjectNameType
            team_id: App\Team\Infrastructure\Persistence\Doctrine\Type\TeamIdType
            team_name: App\Team\Infrastructure\Persistence\Doctrine\Type\TeamNameType
            user_id_list: App\Team\Infrastructure\Persistence\Doctrine\Type\UserIdListType
            app_source_id: App\AppSource\Infrastructure\Persistence\Doctrine\Type\AppSourceIdType
            application_id: App\AppManager\Infrastructure\Persistence\Doctrine\Type\ApplicationIdType
            application_state: App\AppManager\Infrastructure\Persistence\Doctrine\Type\ApplicationStateType
            application_history_log_id: App\AppManager\Infrastructure\Persistence\Doctrine\Type\UuidType
            application_dto: App\AppManager\Infrastructure\Persistence\Doctrine\Type\ApplicationDtoType
            template_id: App\Build\Infrastructure\Persistence\Doctrine\Type\TemplateIdType
            build_job_id: App\Build\Infrastructure\Persistence\Doctrine\Type\BuildJobIdType
            build_status: App\Build\Infrastructure\Persistence\Doctrine\Type\BuildStatusType
            param_schema: App\Build\Infrastructure\Persistence\Doctrine\Type\ParamSchemaType
            build_yaml_snapshot: App\Build\Infrastructure\Persistence\Doctrine\Type\BuildYamlSnapshotType
            deploy_attempt_id: App\Deploy\Infrastructure\Persistence\Doctrine\Type\DeployAttemptIdType
            deploy_status: App\Deploy\Infrastructure\Persistence\Doctrine\Type\DeployStatusType
            deploy_values: App\Deploy\Infrastructure\Persistence\Doctrine\Type\DeployValuesType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        # Mapeo explícito por BC, nunca auto_mapping ni atributos en las clases de
        # dominio — el dominio no importa nada de Doctrine (ver CLAUDE.md global).
        auto_mapping: false
        mappings:
            Project:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Project/Infrastructure/Persistence/Doctrine/mapping'
                prefix: 'App\Project\Domain'
                alias: Project
            Team:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Team/Infrastructure/Persistence/Doctrine/mapping'
                prefix: 'App\Team\Domain'
                alias: Team
            AppSource:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/AppSource/Infrastructure/Persistence/Doctrine/mapping'
                prefix: 'App\AppSource\Domain'
                alias: AppSource
            AppManager:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/AppManager/Infrastructure/Persistence/Doctrine/mapping'
                prefix: 'App\AppManager\Domain'
                alias: AppManager
            Build:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Build/Infrastructure/Persistence/Doctrine/mapping'
                prefix: 'App\Build\Domain'
                alias: Build
            Deploy:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Deploy/Infrastructure/Persistence/Doctrine/mapping'
                prefix: 'App\Deploy\Domain'
                alias: Deploy

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
            # dama/doctrine-test-bundle necesita mantener viva la misma conexión
            # real entre reboots del kernel de cada test — el middleware de
            # reconexión por inactividad se lo impediría.
            idle_connection_ttl: 0

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
