# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Project\Domain\Port\PodiumManifestReader: '@App\Project\Infrastructure\Manifest\NotImplementedPodiumManifestReader'
    App\AppManager\Domain\Port\TemplateResolver: '@App\AppManager\Infrastructure\Template\NotImplementedTemplateResolver'

    # Sin consumidor real todavía (nada type-hinta el puerto aún) — autowiring
    # no genera el alias interfaz→implementación por sí solo, y sin uso el
    # compilador lo eliminaría del contenedor aunque se declare a mano; por
    # eso necesita `public: true`, igual que los ApplicationService de abajo.
    App\AppManager\Domain\Port\ApplicationHistoryLogRepository:
        alias: App\AppManager\Infrastructure\Persistence\DoctrineApplicationHistoryLogRepository
        public: true

    # Puntos de entrada reales de cada BC — públicos porque los llaman
    # controllers/consumers/tests directamente, no solo otros servicios.
    App\Project\Application\ApplicationService:
        public: true
    App\Team\Application\ApplicationService:
        public: true
    App\AppManager\Application\ApplicationService:
        public: true
    App\Build\Application\ApplicationService:
        public: true
    App\Deploy\Application\ApplicationService:
        public: true

when@test:
    services:
        App\Project\Domain\Port\PodiumManifestReader: '@App\Project\Infrastructure\Manifest\InMemoryPodiumManifestReader'
        App\AppManager\Domain\Port\TemplateResolver: '@App\AppManager\Infrastructure\Template\InMemoryTemplateResolver'
