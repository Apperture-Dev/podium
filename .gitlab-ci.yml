stages:
  - test
  - build
  - deploy

# Configuración de Buildah reutilizada tal cual del patrón ya probado en
# craft-market/.gitlab-ci.yml (imagen quay.io/buildah/stable, storage.conf con
# fuse-overlayfs, aislamiento chroot) — no se reinventa.
.buildah-base:
  image: quay.io/buildah/stable
  variables:
    FF_USE_ADVANCED_POD_SPEC_CONFIGURATION: "true"
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot
    BUILDAH_LAYERS: "true"
  before_script:
    - mkdir -p /tmp/containers/storage /tmp/containers/run
    - |
      cat > /etc/containers/storage.conf << 'EOF'
      [storage]
        driver = "overlay"
        graphroot = "/tmp/containers/storage"
        runroot = "/tmp/containers/run"

        [storage.options.overlay]
          mount_program = "/usr/bin/fuse-overlayfs"
          mountopt = "nodev,fsync=0"
          ignore_chown_errors = "true"
          skip_mount_home = "true"
      EOF
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# Job de deploy compartido: clona el propio repo con el CI_JOB_TOKEN (el
# proyecto ya tiene permiso de push configurado para el job token — Settings
# > CI/CD > Job token permissions), bumpea el tag+digest de la imagen en
# deploy/overlays/prod y empuja el commit con "[skip ci]" para no disparar
# una pipeline nueva sobre el mismo push.
#
# Nota: esto solo empuja al remoto de GitLab (origin-gitlab en local) — el
# espejo de GitHub no se actualiza automáticamente, hay que traer el commit a
# mano (git pull origin-gitlab main) antes de seguir trabajando en local.
.deploy-base:
  # alpine/git fija ENTRYPOINT ["git"] — sin sobreescribirlo, el runner acaba
  # ejecutando "git sh -c '<script>'" en vez de "sh -c '<script>'" y falla
  # con "git: 'sh' is not a git command".
  image:
    name: alpine/git:latest
    entrypoint: [""]
  stage: deploy
  before_script:
    - apk add --no-cache curl bash
    - curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.1/kustomize_v5.4.1_linux_amd64.tar.gz | tar xz -C /usr/local/bin/
    - git config --global user.email "ci-deploy@hostium"
    - git config --global user.name "GitLab CI Deploy Bot"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build-php:
  extends: .buildah-base
  stage: build
  script:
    - |
      buildah bud --isolation=chroot --layers \
        --cache-from "$CI_REGISTRY_IMAGE/php" \
        --target prod \
        -t "$CI_REGISTRY_IMAGE/php:$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY_IMAGE/php:latest" \
        -f services/php/docker/franken-php/Dockerfile services/php
    - buildah push "$CI_REGISTRY_IMAGE/php:latest"
    - buildah push --digestfile /tmp/image-digest.txt "$CI_REGISTRY_IMAGE/php:$CI_COMMIT_SHORT_SHA"
    - echo "IMAGE_DIGEST=$(cat /tmp/image-digest.txt)" > build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - services/php/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - services/php/**/*

build-web:
  extends: .buildah-base
  stage: build
  script:
    - |
      buildah bud --isolation=chroot --layers \
        --cache-from "$CI_REGISTRY_IMAGE/web" \
        -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY_IMAGE/web:latest" \
        -f services/web/docker/Dockerfile services/web
    - buildah push "$CI_REGISTRY_IMAGE/web:latest"
    - buildah push --digestfile /tmp/image-digest.txt "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
    - echo "IMAGE_DIGEST=$(cat /tmp/image-digest.txt)" > build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - services/web/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - services/web/**/*

deploy-php:
  extends: .deploy-base
  needs:
    - job: build-php
      artifacts: true
  script:
    - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" deploy-repo
    - cd deploy-repo/deploy/overlays/prod
    - |
      if [ -n "$IMAGE_DIGEST" ]; then
        kustomize edit set image "$CI_REGISTRY_IMAGE/php=$CI_REGISTRY_IMAGE/php:$CI_COMMIT_SHORT_SHA@$IMAGE_DIGEST"
      else
        kustomize edit set image "$CI_REGISTRY_IMAGE/php:$CI_COMMIT_SHORT_SHA"
      fi
    - git add kustomization.yaml
    - git diff --cached --quiet && echo "Sin cambios, nada que commitear" && exit 0
    - |
      git commit -m "deploy: hostium php@$CI_COMMIT_SHORT_SHA [skip ci]

      Pipeline: $CI_PIPELINE_ID  Commit: $CI_COMMIT_SHA"
    - for i in 1 2 3; do git push origin HEAD:main && break || git pull --rebase origin main; done
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - services/php/**/*

deploy-web:
  extends: .deploy-base
  needs:
    - job: build-web
      artifacts: true
  script:
    - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" deploy-repo
    - cd deploy-repo/deploy/overlays/prod
    - |
      if [ -n "$IMAGE_DIGEST" ]; then
        kustomize edit set image "$CI_REGISTRY_IMAGE/web=$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA@$IMAGE_DIGEST"
      else
        kustomize edit set image "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
      fi
    - git add kustomization.yaml
    - git diff --cached --quiet && echo "Sin cambios, nada que commitear" && exit 0
    - |
      git commit -m "deploy: hostium web@$CI_COMMIT_SHORT_SHA [skip ci]

      Pipeline: $CI_PIPELINE_ID  Commit: $CI_COMMIT_SHA"
    - for i in 1 2 3; do git push origin HEAD:main && break || git pull --rebase origin main; done
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - services/web/**/*

test-activator:
  stage: test
  image: golang:1.23-bookworm
  script:
    - cd services/activator
    - go vet ./...
    - go test ./... -race
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - services/activator/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - services/activator/**/*

build-activator:
  extends: .buildah-base
  stage: build
  needs: ["test-activator"]
  script:
    - |
      buildah bud --isolation=chroot --layers \
        --cache-from "$CI_REGISTRY_IMAGE/activator" \
        --target prod \
        -t "$CI_REGISTRY_IMAGE/activator:$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY_IMAGE/activator:latest" \
        -f services/activator/Dockerfile services/activator
    - buildah push "$CI_REGISTRY_IMAGE/activator:latest"
    - buildah push --digestfile /tmp/image-digest.txt "$CI_REGISTRY_IMAGE/activator:$CI_COMMIT_SHORT_SHA"
    - echo "IMAGE_DIGEST=$(cat /tmp/image-digest.txt)" > build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - services/activator/**/*

test-build-launcher:
  stage: test
  image: golang:1.23-bookworm
  script:
    - cd services/build-launcher
    - go vet ./...
    - go test ./... -race
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - services/build-launcher/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - services/build-launcher/**/*

build-build-launcher:
  extends: .buildah-base
  stage: build
  needs: ["test-build-launcher"]
  script:
    - |
      buildah bud --isolation=chroot --layers \
        --cache-from "$CI_REGISTRY_IMAGE/build-launcher" \
        --target prod \
        -t "$CI_REGISTRY_IMAGE/build-launcher:$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY_IMAGE/build-launcher:latest" \
        -f services/build-launcher/Dockerfile services/build-launcher
    - buildah push "$CI_REGISTRY_IMAGE/build-launcher:latest"
    - buildah push --digestfile /tmp/image-digest.txt "$CI_REGISTRY_IMAGE/build-launcher:$CI_COMMIT_SHORT_SHA"
    - echo "IMAGE_DIGEST=$(cat /tmp/image-digest.txt)" > build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - services/build-launcher/**/*

package-podium-app-chart:
  stage: build
  image: alpine/helm:latest
  script:
    - echo "$ZOT_REGISTRY_PASSWORD" | helm registry login registry.apperture.dev -u "$ZOT_REGISTRY_USER" --password-stdin
    - helm package helm/podium-app
    - helm push podium-app-*.tgz oci://registry.apperture.dev/charts
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - helm/podium-app/**/*
