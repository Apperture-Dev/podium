apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    # Sin esto, external-dns manda TTL "1" (Cloudflare lo interpreta como
    # "Auto", ~5 min reales) a la API de Cloudflare — de sobra para uso
    # normal, pero demasiado lento para la demo del hackathon (cambiar de
    # hash y esperar a que resuelva). 60s fuerza el mismo TTL que ya se
    # había puesto a mano una vez en el dashboard de Cloudflare, ahora
    # automático para cualquier tenant nuevo.
    external-dns.alpha.kubernetes.io/ttl: "60"
spec:
  ingressClassName: nginx
  # apperture-wildcard-tls cubre *.apperture.dev (un solo nivel) — el
  # operador Reflector ya lo refleja automáticamente en cualquier namespace
  # nuevo (confirmado contra el clúster real), así que ya existe en el
  # namespace del tenant en cuanto ArgoCD lo crea, sin ningún paso manual.
  # host = "{hash}.apperture.dev" es exactamente un nivel bajo apperture.dev,
  # así que el wildcard lo cubre (a diferencia de dominios de dos niveles
  # como los propios de Hostium, que sí necesitan cert-manager por host).
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: apperture-wildcard-tls
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: 80
