# Segunda línea de defensa: monitoring rechaza tráfico de cualquier namespace
# etiquetado hackathon=true, y sigue aceptando todo lo demás (KEDA, Grafana, tus apps).
# Replica este mismo manifiesto en cognos, keycloak, etc. cambiando el namespace.
#
#   kubectl apply -f 02-protect-monitoring.yaml
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-hackathon-tenants
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: hackathon
                operator: DoesNotExist
