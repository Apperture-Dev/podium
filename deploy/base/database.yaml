# CNPG Cluster llamado "postgres" a propósito: el secret autogenerado por CNPG
# para la base de datos por defecto ("app", owner "app") queda como "postgres-app",
# sin configuración adicional — mismo truco de naming que craft-market-gitops.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 2
  storage:
    size: 2Gi
  monitoring:
    enablePodMonitor: true
---
# Segunda base de datos ("keycloak") en el mismo Cluster, con el MISMO rol
# "app" que ya crea el bootstrap por defecto de CNPG como owner — en vez de
# declarar un rol nuevo (managed.roles) con un Secret de contraseña creado a
# mano. Así Keycloak se conecta con las mismas credenciales autogeneradas en
# "postgres-app" (mismo username/password, distinto nombre de base), sin
# ningún secreto manual para Postgres. Contrapartida asumida para esta primera
# versión: el rol "app" tiene acceso a ambas bases — aceptable porque php y
# Keycloak son ambos servicios propios de Podium, no tenants distintos.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
spec:
  name: keycloak
  owner: app
  cluster:
    name: postgres
