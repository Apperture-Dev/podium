# CNPG Cluster llamado "postgres" a propósito: el secret autogenerado por CNPG
# para la base de datos por defecto ("app", owner "app") queda como "postgres-app",
# sin configuración adicional — mismo truco de naming que craft-market-gitops.
#
# Segunda base de datos "keycloak" en el mismo Cluster: rol gestionado por CNPG
# (managed.roles) con la contraseña en un Secret creado a mano (ver deploy/README.md),
# más un CR Database (CNPG >=1.24) que la crea con ese rol como owner.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 2
  storage:
    size: 2Gi
  monitoring:
    enablePodMonitor: true
  managed:
    roles:
      - name: keycloak
        ensure: present
        login: true
        passwordSecret:
          name: keycloak-db-role
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
spec:
  name: keycloak
  owner: keycloak
  cluster:
    name: postgres
