# CR Redis del operador OpsTree — kind "Redis" (standalone), no
# "RedisReplication". El operador ya está instalado como infraestructura de
# plataforma; este proyecto solo declara su propia instancia.
#
# Naming real, confirmado contra el clúster (kubectl -n hostium get svc):
# el Service generado se llama literalmente "redis" — el sufijo "-master"
# que sí usa craft-market-gitops/base/redis.yaml es propio del kind
# "RedisReplication" (roles maestro/réplica), no de este "Redis" standalone.
# No asumir el mismo naming solo porque el operador es el mismo.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: redis
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.12
    imagePullPolicy: IfNotPresent
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.44.0
    imagePullPolicy: Always
