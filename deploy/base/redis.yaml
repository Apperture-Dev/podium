# CR Redis del operador OpsTree, llamado "redis" a propósito para que el
# Service autogenerado sea "redis-master" (mismo truco de naming que
# craft-market-gitops/base/redis.yaml). El operador ya está instalado como
# infraestructura de plataforma; este proyecto solo declara su propia instancia.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: redis
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.12
    imagePullPolicy: IfNotPresent
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.44.0
    imagePullPolicy: Always
