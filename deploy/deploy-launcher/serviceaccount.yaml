# Namespace fijado explícitamente en cada manifiesto de este directorio —
# a diferencia de deploy/build-launcher/, aquí NO se usa el campo
# "namespace:" global de kustomization.yaml, porque la RBAC de este
# lanzador necesita vivir en el namespace "argocd" (donde vive el CRD
# Application que manipula), no en el propio namespace del Deployment. Ese
# campo global reescribiría el namespace de TODOS los recursos por igual.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-launcher
  namespace: podium-deploy
