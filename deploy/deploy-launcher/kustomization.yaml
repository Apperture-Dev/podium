apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sin "namespace:" global a propósito — ver el comentario en
# serviceaccount.yaml. Cada recurso fija su propio metadata.namespace.
resources:
  - serviceaccount.yaml
  - argocd-rbac.yaml
  - deployment.yaml
# Tag inicial: actualizar a mano tras el primer build de CI (o dejar que un
# futuro job deploy-deploy-launcher lo automatice, mismo patrón que
# deploy-php/web/activator/build-launcher — ver .gitlab-ci.yml).
images:
  - name: REGISTRY_PLACEHOLDER/deploy-launcher
    newName: registry.gitlab.com/apperturedev/podium/deploy-launcher
    newTag: latest
