apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sin "namespace:" global a propósito — ver el comentario en
# serviceaccount.yaml. Cada recurso fija su propio metadata.namespace.
resources:
  - serviceaccount.yaml
  - argocd-rbac.yaml
  - deployment.yaml
# Lo actualiza el job deploy-deploy-launcher de .gitlab-ci.yml en cada cambio bajo
# services/deploy-launcher/: escribe aquí el tag por SHA (con digest) y commitea, y
# ArgoCD hace el rollout. El tag de abajo es solo el punto de partida.
images:
  - name: REGISTRY_PLACEHOLDER/deploy-launcher
    newName: registry.gitlab.com/apperturedev/podium/deploy-launcher
    newTag: latest
