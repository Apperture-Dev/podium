apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-launcher
  namespace: hostium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deploy-launcher
  template:
    metadata:
      labels:
        app: deploy-launcher
    spec:
      serviceAccountName: deploy-launcher
      # El registro de GitLab es privado — a diferencia de zot-pull-secret,
      # "gitlab-token-auth" no se refleja automáticamente en namespaces
      # nuevos (ver deploy/README.md, "Pull de imágenes... solo se copia").
      imagePullSecrets:
        - name: gitlab-token-auth
      containers:
        - name: deploy-launcher
          image: REGISTRY_PLACEHOLDER/deploy-launcher:latest
          env:
            # Redis vive en el namespace "hostium" (mismo que consume php) —
            # nombre corto de Service no basta desde otro namespace. El
            # Service se llama "redis" (CR kind "Redis" standalone, no
            # "RedisReplication" — no lleva sufijo "-master").
            - name: REDIS_ADDR
              value: "redis.hostium.svc.cluster.local:6379"
            - name: ARGOCD_NAMESPACE
              value: "argocd"
            - name: CHART_REPO_URL
              value: "registry.apperture.dev/charts"
            - name: CHART_NAME
              value: "podium-app"
            - name: CHART_VERSION
              value: "0.1.2"
            - name: BASE_DOMAIN
              value: "apperture.dev"
            # waitForHealthy hace N intentos con (N-1) esperas entre medio —
            # el ciclo real de deploy-launcher/internal/launcher.go revisa en
            # t=0, t=intervalo, t=2*intervalo... y termina en el intento N
            # sin esperar más, así que el margen real es (N-1)*intervalo, no
            # N*intervalo. Con el default (3 intentos, 5s) eso son solo 10s
            # de margen real — visto fallar dos veces en el primer deploy de
            # verdad: el pod tardó 41s y luego 47s solo en llegar a Running
            # (pull de imagen + arranque de Next.js), antes de que ArgoCD
            # siquiera reflejara salud. 6 intentos x 20s = 100s de margen
            # real, con holgura sobre esos tiempos observados y sobre el
            # objetivo de "live public URL en ~60s" de
            # docs/hackathon-plan/plan-hackbarna-2026.md. HEALTH_MAX_ATTEMPTS
            # sube de su default (3, el invariante que documenta
            # docs/podium-domain/deploy/discovery.md como "política de
            # infra, no de dominio" — sigue siendo el mismo dato informativo
            # en DeployFailed.retryCount, solo cambia cuántas veces se
            # comprueba antes de darse por vencido).
            - name: HEALTH_POLL_INTERVAL
              value: "20s"
            - name: HEALTH_MAX_ATTEMPTS
              value: "6"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
