apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-launcher
  namespace: hostium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deploy-launcher
  template:
    metadata:
      labels:
        app: deploy-launcher
    spec:
      serviceAccountName: deploy-launcher
      # El registro de GitLab es privado — a diferencia de zot-pull-secret,
      # "gitlab-token-auth" no se refleja automáticamente en namespaces
      # nuevos (ver deploy/README.md, "Pull de imágenes... solo se copia").
      imagePullSecrets:
        - name: gitlab-token-auth
      containers:
        - name: deploy-launcher
          image: REGISTRY_PLACEHOLDER/deploy-launcher:latest
          env:
            # Redis vive en el namespace "hostium" (mismo que consume php) —
            # nombre corto de Service no basta desde otro namespace. El
            # Service se llama "redis" (CR kind "Redis" standalone, no
            # "RedisReplication" — no lleva sufijo "-master").
            - name: REDIS_ADDR
              value: "redis.hostium.svc.cluster.local:6379"
            - name: ARGOCD_NAMESPACE
              value: "argocd"
            - name: CHART_REPO_URL
              value: "registry.apperture.dev/charts"
            - name: CHART_NAME
              value: "podium-app"
            - name: CHART_VERSION
              value: "0.1.1"
            - name: BASE_DOMAIN
              value: "apperture.dev"
            # 3 reintentos es el invariante confirmado en
            # docs/podium-domain/deploy/discovery.md (política de infra, no
            # de dominio) — el default de 5s entre intentos (15s en total)
            # resultó demasiado corto en el primer deploy real: el pod tardó
            # 41s solo en llegar a Running (pull de imagen + arranque).
            # 20s x 3 = 60s, alineado con el objetivo de
            # docs/hackathon-plan/plan-hackbarna-2026.md ("live public URL
            # en ~60s").
            - name: HEALTH_POLL_INTERVAL
              value: "20s"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
