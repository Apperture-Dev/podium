apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: podium-build
resources:
  - rbac.yaml
  - deployment.yaml
# Tag inicial: actualizar a mano tras el primer build de CI (o dejar que un
# futuro job deploy-build-launcher lo automatice, mismo patrón que
# deploy-php/web/activator — ver .gitlab-ci.yml).
images:
  - name: REGISTRY_PLACEHOLDER/build-launcher
    newName: registry.gitlab.com/apperturedev/podium/build-launcher
    newTag: latest
