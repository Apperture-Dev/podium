apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hostium
resources:
  - rbac.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
# Tag inicial: actualizar a mano tras el primer build de CI (o dejar que un
# futuro job deploy-activator lo automatice, mismo patrón que deploy-php/web
# — ver .gitlab-ci.yml).
images:
  - name: REGISTRY_PLACEHOLDER/activator
    newName: registry.gitlab.com/apperturedev/podium/activator
    newTag: latest
