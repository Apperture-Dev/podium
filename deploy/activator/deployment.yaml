apiVersion: apps/v1
kind: Deployment
metadata:
  name: activator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: activator
  template:
    metadata:
      labels:
        app: activator
    spec:
      serviceAccountName: activator
      containers:
        - name: activator
          image: REGISTRY_PLACEHOLDER/activator:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ACTIVATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ACTIVATOR_SERVICE_NAME
              value: "activator"
            - name: ACTIVATOR_SERVICE_PORT
              value: "8080"
            - name: ACTIVATOR_IDLE_THRESHOLD
              value: "15m"
            - name: ACTIVATOR_SWEEP_INTERVAL
              value: "30s"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # Sin endpoint /health dedicado todavía (el handler solo sabe
          # proxyar/404 por host desconocido, que un probe httpGet trataría
          # como fallo) — TCP basta para confirmar que el proceso escucha.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
