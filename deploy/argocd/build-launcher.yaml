# Igual que el activator (ver el comentario en deploy/argocd/activator.yaml):
# a diferencia del despliegue de apps de equipos del hackathon (chart OCI +
# Application aplicada con kubectl, sin git), el build-launcher es
# infraestructura propia de Podium — una sola instancia, cambios poco
# frecuentes, con permisos de creación de Jobs sobre su propio namespace — se
# trata como código de producto, trackeado en git con revisión por PR, igual
# que deploy/argocd/hostium.yaml y deploy/argocd/activator.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: build-launcher
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/apperturedev/podium.git
    targetRevision: HEAD
    path: deploy/build-launcher
  destination:
    server: https://kubernetes.default.svc
    namespace: hostium
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
