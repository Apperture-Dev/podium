apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hostium
resources:
- ../../base
# Tags iniciales: actualizar a mano tras el primer build de CI (kustomize edit
# set image, commit con "[skip ci]" — ver deploy/README.md). newName asume que
# el proyecto de GitLab es apperturedev/podium; ajustar si difiere.
images:
- name: REGISTRY_PLACEHOLDER/php
  newName: registry.gitlab.com/apperturedev/podium/php
  newTag: latest
- name: REGISTRY_PLACEHOLDER/web
  newName: registry.gitlab.com/apperturedev/podium/web
  newTag: latest
- digest: sha256:f3377735d7e6c3f9e4ce92885d7b80aa94de675aa586caef2112bda806462161
  name: registry.gitlab.com/apperturedev/podium/php
  newName: registry.gitlab.com/apperturedev/podium/php
  newTag: 0c44a0e6
